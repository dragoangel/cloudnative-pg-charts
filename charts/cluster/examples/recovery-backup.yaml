type: postgresql
mode: recovery

recovery:
  method: backup
  methodSettings:
    backup:
      name: database-clustermarket-database-daily-backup-1683244800

cluster:
  instances: 1

backups:
  objectStorage:
    provider: s3
    providerSettings:
      s3:
        region: eu-west-1
        bucket: db-backups
        path: /v1-restore
        accessKey: "AWS_S3_ACCESS_KEY"
        secretKey: "AWS_S3_SECRET_KEY"
  scheduledBackups:
    - name: daily-backup # Daily at midnight
      schedule: "0 0 0 * * *" # Daily at midnight
      backupOwnerReference: self
  retentionPolicy: 30d
