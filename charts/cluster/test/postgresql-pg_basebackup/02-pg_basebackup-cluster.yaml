type: postgresql
mode: recovery
recovery:
  existingSecret:
    name: source-cluster-replication
  method: pgBasebackup
  methodSettings:
    pgBasebackup:
      connectionParameters:
        host: source-cluster-rw
        database: mygooddb
        username: streaming_replica
        sslMode: require
      auth: tls
cluster:
  instances: 2
  storage:
    size: 256Mi
